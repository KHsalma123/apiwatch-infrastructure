
name: APIWatch Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  ansible:
    name: Ansible Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Check Docker installation playbook
        run: ansible-playbook -i ansible/inventory.ini.example ansible/install-docker.yml --syntax-check

      - name: Check APIWatch deployment playbook
        run: ansible-playbook -i ansible/inventory.ini.example ansible/deploy-apiwatch.yml --syntax-check
